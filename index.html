<!doctype html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>پاکستان جابز</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f7f8;margin:0;color:#17313b}
header{background:#0b7a5c;color:#fff;padding:22px 16px;text-align:center}
h1{margin:0 0 8px;font-size:28px}
.container{max-width:900px;margin:auto;padding:16px}
.card{background:#fff;border-radius:14px;padding:16px;margin:14px 0;box-shadow:0 2px 10px #0001}
input,select,textarea,button{width:100%;box-sizing:border-box;padding:12px;margin:7px 0;border:1px solid #ccd5d8;border-radius:9px;font-size:16px}
button{background:#0b7a5c;color:#fff;border:0;font-weight:bold;cursor:pointer}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}
.job h3{margin:0 0 7px;color:#075c46}
.meta{color:#667;line-height:1.8}
.small{font-size:13px;color:#667}
.empty{text-align:center;color:#777;padding:20px}
@media(max-width:650px){.filters{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
<h1>🇵🇰 پاکستان جابز</h1>
<div>پاکستان بھر میں نوکری تلاش کریں اور نوکری پوسٹ کریں</div>
</header>

<div class="container">
<div class="card">
<h2>🔎 نوکری تلاش کریں</h2>
<div class="filters">
<input id="search" placeholder="مثلاً AC Technician، Driver">
<select id="city"><option value="">تمام شہر</option><option>اسلام آباد</option><option>راولپنڈی</option><option>لاہور</option><option>پشاور</option><option>نوشہرہ</option><option>اٹک</option><option>کراچی</option></select>
<select id="category"><option value="">تمام شعبے</option><option>AC Technician</option><option>Solar Technician</option><option>Electrician</option><option>Driver</option><option>Helper</option><option>Other</option></select>
</div>
</div>

<div id="jobs"></div>

<div class="card">
<h2>➕ اپنی نوکری پوسٹ کریں</h2>
<input id="title" placeholder="نوکری کا نام">
<select id="cat"><option>AC Technician</option><option>Solar Technician</option><option>Electrician</option><option>Driver</option><option>Helper</option><option>Other</option></select>
<input id="jobcity" placeholder="شہر">
<input id="salary" placeholder="تنخواہ">
<input id="contact" placeholder="رابطہ نمبر">
<textarea id="description" placeholder="نوکری کی تفصیل"></textarea>
<button onclick="addJob()">نوکری پوسٹ کریں</button>
</div>
</div>

<script>
const key='pak_jobs_v1';
let jobs=JSON.parse(localStorage.getItem(key)||'[]');
if(!jobs.length){
jobs=[
{title:'AC Technician',category:'AC Technician',city:'اسلام آباد',salary:'35,000 - 60,000',contact:'رابطہ کریں',description:'AC installation, service اور maintenance کا کام۔'},
{title:'Solar Technician',category:'Solar Technician',city:'راولپنڈی',salary:'40,000 - 70,000',contact:'رابطہ کریں',description:'Solar panels installation اور maintenance۔'}
];
save();
}
function save(){localStorage.setItem(key,JSON.stringify(jobs))}
function render(){
const q=document.getElementById('search').value.trim().toLowerCase();
const c=document.getElementById('city').value;
const cat=document.getElementById('category').value;
const list=jobs.filter(j=>(!q||JSON.stringify(j).toLowerCase().includes(q))&&(!c||j.city===c)&&(!cat||j.category===cat));
document.getElementById('jobs').innerHTML=list.length?list.map((j,i)=>`
<div class="card job">
<h3>${esc(j.title)}</h3>
<div class="meta">📍 ${esc(j.city)} &nbsp; | &nbsp; 💼 ${esc(j.category)}<br>💰 ${esc(j.salary||'تنخواہ درج نہیں')}</div>
<p>${esc(j.description||'')}</p>
<div class="small">📞 ${esc(j.contact||'')}</div>
<button onclick="shareJob(${i})">شیئر کریں</button>
</div>`).join(''):'<div class="card empty">کوئی نوکری نہیں ملی۔</div>';
}
function addJob(){
const title=document.getElementById('title').value.trim();
const city=document.getElementById('jobcity').value.trim();
if(!title||!city){alert('نوکری کا نام اور شہر ضرور لکھیں');return}
jobs.unshift({title,category:document.getElementById('cat').value,city,salary:document.getElementById('salary').value.trim(),contact:document.getElementById('contact').value.trim(),description:document.getElementById('description').value.trim()});
save();render();
['title','jobcity','salary','contact','description'].forEach(id=>document.getElementById(id).value='');
alert('نوکری کامیابی سے پوسٹ ہوگئی');
}
function shareJob(i){
const j=jobs[i], text=`${j.title}\nشہر: ${j.city}\nشعبہ: ${j.category}\nتنخواہ: ${j.salary}\nرابطہ: ${j.contact}`;
if(navigator.share) navigator.share({title:j.title,text}); else navigator.clipboard?.writeText(text).then(()=>alert('تفصیل کاپی ہوگئی'));
}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
['search','city','category'].forEach(id=>document.getElementById(id).addEventListener('input',render));
render();
</script>
</body>
</html>
